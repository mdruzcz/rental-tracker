<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f1ea" />
  <title>Rental Tracker</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Rental Tracker</div>
    <nav class="tabs">
      <button class="tab active" data-view="dashboard">Dashboard</button>
      <button class="tab" data-view="properties">Properties</button>
      <button class="tab" data-view="calendar">Calendar</button>
      <button class="tab" data-view="bookings">Bookings</button>
      <button class="tab" data-view="financials">Money</button>
      <button class="tab" data-view="insights">Insights</button>
      <div class="tab-group">
        <button class="tab tools-toggle" id="toolsToggle">More <span id="moreBadge" class="pill hidden">0</span><span class="caret">&#9662;</span></button>
        <div class="tab-dropdown hidden" id="toolsDropdown">
          <div class="dropdown-section">Bookings</div>
          <button class="dropdown-item" data-view="ltr">Long-Term Rental</button>
          <button class="dropdown-item" data-view="pricing">Pricing</button>
          <button class="dropdown-item" data-view="requests">Requests<span id="requestsBadge" class="pill hidden">0</span></button>
          <button class="dropdown-item" data-view="todos">To&nbsp;Do<span id="todosBadge" class="pill hidden">0</span></button>
          <button class="dropdown-item" data-view="guests">Guests</button>
          <div class="dropdown-divider"></div>
          <div class="dropdown-section">Operations</div>
          <button class="dropdown-item" data-view="annual">Annual Forecast</button>
          <button class="dropdown-item" data-view="roi">Annual ROI (P&amp;L)</button>
          <button class="dropdown-item" data-view="ledger">Bank Ledger<span id="ledgerBadge" class="pill hidden">0</span></button>
          <button class="dropdown-item" data-view="expenses">Expenses</button>
          <button class="dropdown-item" data-view="messaging">Guest Messaging</button>
          <button class="dropdown-item" data-view="reviews">Reviews</button>
          <button class="dropdown-item" data-view="upsellCatalog">Upsell Catalog</button>
          <button class="dropdown-item" data-view="cleaners">Cleaners</button>
          <div class="dropdown-divider"></div>
          <div class="dropdown-section">Tools</div>
          <button class="dropdown-item" data-view="bulk">Bulk Import</button>
          <button class="dropdown-item" data-view="mailing">Mailing List</button>
          <button class="dropdown-item" data-view="maintenance">Maintenance</button>
          <button class="dropdown-item" data-view="cleanerCal">Cleaner Calendar</button>
          <button class="dropdown-item" data-view="licensing">Licensing</button>
          <button class="dropdown-item" data-view="smsInbox">SMS Inbox</button>
          <button class="dropdown-item" data-view="settings">Settings</button>
        </div>
      </div>
    </nav>
    <button id="syncAllBtn" class="btn-primary small">Sync all calendars</button>
  </header>

  <main id="app"></main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modalTitle">Title</h3>
        <button id="modalClose" class="icon-btn" aria-label="Close">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
